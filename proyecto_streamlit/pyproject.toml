[project]
name = "proyecto-streamlit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paula Lull Rios", email = "paulalullrios14@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
